name: Publicar

# Só publica quando o commit da main começa com "feat:".
# README, documentação e correções não alteram releases existentes.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'feat:')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determinar próxima versão
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tags = git tag --list 'v*' | Where-Object { $_ -match '^v\d+\.\d+(\.\d+)?$' }
          if ($tags) {
            $current = $tags | ForEach-Object { $_ -replace '^v', '' } | Sort-Object { [version]$_ } -Descending | Select-Object -First 1
            $parts = $current.Split('.')
            $major = [int]$parts[0]
            $minor = [int]$parts[1]
          } else {
            $releaseName = gh release view latest --json name --jq .name
            if ($releaseName -notmatch 'v(?<major>\d+)\.(?<minor>\d+)') {
              throw "Não consegui identificar a versão atual pelo título da release: $releaseName"
            }
            $major = [int]$Matches.major
            $minor = [int]$Matches.minor
          }
          $version = "v$major.$($minor + 1)"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publicar executável
        run: dotnet publish ResetExplode.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo

      - name: Montar arquivos da versão
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          $exe = "ResetExplodePlus-$env:VERSION.exe"
          $zip = "ResetExplodePlus-$env:VERSION.zip"
          Copy-Item dist/ResetExplode.exe $exe
          Compress-Archive -Path $exe, dist/LEIA-ME.txt -DestinationPath $zip
          "exe=$exe" >> $env:GITHUB_ENV
          "zip=$zip" >> $env:GITHUB_ENV

      - name: Criar nova release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $lines = $env:COMMIT_MESSAGE -split "`r?`n"
          $summary = $lines[0] -replace '^feat:\s*', ''
          $details = ($lines | Select-Object -Skip 1) -join "`n"
          $notes = "## Novidades`n`n- $summary"
          if (-not [string]::IsNullOrWhiteSpace($details)) {
            $notes += "`n`n$($details.Trim())"
          }
          gh release create $env:VERSION $env:EXE $env:ZIP --target $env:GITHUB_SHA --latest --title "RESET EXPLODE PLUS - $env:VERSION" --notes $notes
